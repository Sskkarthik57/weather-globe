# Fetches fresh GFS + cyclone data every 6 hours, builds the site and publishes it to GitHub Pages.
# Data files are generated here and deployed directly; they are not committed to the repository.
name: Update data and deploy

on:
  schedule:
    # GFS runs at 00/06/12/18 UTC and is complete out to 72 h roughly 4-5 h later
    - cron: '35 4,10,16,22 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download weather data
        run: python scripts/update_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Build site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
